name: Test Build

on:
  workflow_dispatch:

jobs:
  call-build-workflow:
    name: Call Build
    # Removed dependency on check_date since we are running manually
    if: ${{ startsWith(github.ref, 'refs/heads/') && !startsWith(github.ref_name, 'chore/') }}
    # Reuse the workflow from the currently selected branch
    uses: ./.github/workflows/default.yml
    secrets: inherit

  docker:
    name: Publish Docker :nightly
    needs:
      - call-build-workflow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0
      - name: Get dist from cache
        uses: actions/cache/restore@v4
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.sha }}-dist
      - name: Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3
      - name: Define tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: felipefc10/evcc
          tags: |
            type=raw,value=nightly
            type=raw,value=nightly.{{date 'YYYYMMDD'}}-{{sha}}
      - name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
      - name: Delete old nightly.* tags
        run: |
          old_tags=$(curl -s "https://hub.docker.com/v2/repositories/felipefc10/evcc/tags/?page_size=100" | jq -r '.results | map(select(.name | startswith("nightly."))) | sort_by(.last_updated) | reverse | .[1:] | .[].name')
          for tag in $old_tags; do
            echo "Deleting tag: $tag"
            curl -s -H "Authorization: Bearer ${{ secrets.DOCKER_PASS }}" -X DELETE "https://hub.docker.com/v2/repositories/felipefc10/evcc/tags/$tag/"
          done

  hassio:
    name: Hass.io Addon :nightly
    needs:
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: felipefc10/hassio-addon # Your Hass.io add-on repo fork
          token: ${{ secrets.GH_TOKEN }}
          path: ./hassio
      - name: Update version in config
        run: |
          current_date=$(date +%Y%m%d)
          short_sha=$(echo "${{ github.sha }}" | cut -c 1-7)
          sed -i -e "s/version:.*/version: nightly.${current_date}-${short_sha}/" ./hassio/evcc-nightly/config.yaml
      - name: Push
        run: |
          cd ./hassio
          git add .
          git config user.name github-actions
          git config user.email github-actions@github.com
          git commit -am "Mirror evcc nightly release"
          git push
