name: Custom Release Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  prepare:
    name: Prepare metadata
    runs-on: ubuntu-latest
    outputs:
      version_tag: ${{ steps.version.outputs.version_tag }}
    steps:
      - name: Compute release version
        id: version
        run: |
          current_date=$(date +%Y%m%d)
          short_sha=$(echo "${GITHUB_SHA}" | cut -c1-7)
          echo "version_tag=experimental.${current_date}-${short_sha}" >> "$GITHUB_OUTPUT"

  docker:
    name: Publish Docker Image
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Restore dist cache
        uses: actions/cache/restore@v4
        id: cache-dist
        with:
          path: dist
          key: ${{ runner.os }}-${{ github.sha }}-dist

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Define Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: felipefc10/evcc
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version_tag }}
            type=ref,event=branch

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v6
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  hassio:
    name: Publish Hass.io Add-on
    needs:
      - docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout add-on repository
        uses: actions/checkout@v5
        with:
          repository: felipefc10/hassio-addon
          token: ${{ secrets.GH_TOKEN }}
          ref: ${{ github.ref_name }}
          path: hassio

      - name: Update add-on version
        working-directory: hassio
        run: |
          version="${{ needs.prepare.outputs.version_tag }}"
          files=(
            "evcc/config.yaml"
            "evcc-nightly/config.yaml"
          )
          updated=0
          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              sed -i -e "s/^version:.*/version: ${version}/" "$file"
              updated=1
            fi
          done
          if [ "$updated" -eq 0 ]; then
            echo "No config.yaml files were updated."
            exit 1
          fi

      - name: Commit and push changes
        working-directory: hassio
        run: |
          if ! git status --short | grep .; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add .
          git commit -m "Publish manual release ${{ needs.prepare.outputs.version_tag }}"
          git push origin HEAD
