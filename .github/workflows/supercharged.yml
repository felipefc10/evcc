name: Supercharged image

# Builds the evcc image with whole-house load management for the Home Assistant add-on.
# Push a tag like 0.316.0-sc7 to publish felipefc10/evcc-supercharged:0.316.0-sc7,
# or run it manually with a version to have the workflow create that tag itself.

on:
  push:
    tags: ["*-sc*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create and publish, e.g. 0.316.1-sc1"
        required: false

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test load management
        run: go test ./core/supercharge/ ./core/circuit/

      - name: Create release tag
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git tag "$VERSION"
          git push origin "refs/tags/$VERSION"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USER }}/evcc-supercharged
          tags: |
            type=ref,event=tag
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') || inputs.version != '' }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/') && inputs.version == '' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          build-args: RELEASE=1
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
